<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCHINA - Modernización</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <h1>OCHINA - Modernización</h1>
      <nav class="main-nav">
        <button type="button" onclick="show('inicio')">Inicio</button>
        <button type="button" onclick="show('servicios')">Servicios</button>
        <button type="button" onclick="show('descargas')">Descargas</button>
        <button type="button" onclick="show('contacto')">Contacto</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="inicio">
      <h2>Bienvenido a OCHINA</h2>
      <p>Portal institucional para la modernización de hidrografía y navegación.</p>
    </section>

    <section id="servicios" class="hidden">
      <h2>Servicios</h2>
      <p>Encuentra datos, reportes y servicios especializados para navegación segura.</p>
    </section>

    <section id="descargas" class="hidden">
      <h2>Descargas</h2>
      <p>Descarga mapas oficiales, boletines y documentos técnicos.</p>
    </section>

    <section id="contacto" class="hidden">
      <h2>Contacto</h2>
      <form class="contact-form" onsubmit="enviarFormulario(event)">
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre completo" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="asunto">Asunto</label>
          <select id="asunto" name="asunto" required>
            <option value="">Selecciona una opción</option>
            <option value="consultas">Consultas Generales</option>
            <option value="tramites">Trámites</option>
            <option value="reportes">Reportes</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje aquí" required></textarea>
        </div>

        <button type="submit" class="primary-button">Enviar</button>
        <div id="formResponse" class="form-response hidden" role="status"></div>
      </form>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
